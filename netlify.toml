[build]
  base = "Base44-source"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_CLOUD_SAVES = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/save"
  to = "/.netlify/functions/save"
  status = 200

[[redirects]]
  from = "/api/multiplayer"
  to = "/.netlify/functions/multiplayer"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
